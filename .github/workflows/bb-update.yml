
name: Atualizar catalogo BB

on:
  workflow_dispatch:

permissions:
  contents: write
  actions: read

concurrency:
  group: bb-catalog-update
  cancel-in-progress: false

jobs:
  atualizar:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Baixar repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalar dependencias
        run: python -m pip install beautifulsoup4

      - name: Verificar intervalo de 15 dias
        id: intervalo
        run: python bb_verificar_intervalo.py

      - name: Verificar catalogo existente
        if: steps.intervalo.outputs.run == 'true'
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          catalogo = Path("bb-catalogo-validacao.json")
          pasta = Path("bb-coleta/por-uf")

          if not catalogo.exists():
              raise SystemExit("Catalogo de IDs ausente")

          arquivos = list(pasta.glob("*.json"))
          if len(arquivos) < 20:
              raise SystemExit(
                  "Catalogo publicado incompleto"
              )

          total = 0
          for arquivo in arquivos:
              dados = json.loads(
                  arquivo.read_text(encoding="utf-8")
              )
              total += len(dados.get("imoveis", []))

          print(f"Estados existentes: {len(arquivos)}")
          print(f"Imoveis existentes: {total}")

          if total < 700:
              raise SystemExit(
                  "Base existente abaixo do minimo"
              )
          PY

      - name: Descobrir catalogo atualizado
        if: steps.intervalo.outputs.run == 'true'
        run: python bb_descobrir_catalogo.py

      - name: Coletar amostra limitada BB
        if: steps.intervalo.outputs.run == 'true'
        run: |
          python bb_coletar_catalogo.py \
            --catalogo bb-catalogo-atualizado.json \
            --limite 0 \
            --pausa 2 \
            --saida bb-coleta-temporaria

      - name: Validar coleta completa
        if: steps.intervalo.outputs.run == 'true'
        run: python bb_validar_publicacao.py

      - name: Publicar catalogo validado
        if: steps.intervalo.outputs.run == 'true'
        run: |
          cp bb-catalogo-atualizado.json bb-catalogo-validacao.json
          mkdir -p bb-coleta/por-uf
          rm -f bb-coleta/por-uf/*.json
          cp bb-coleta-temporaria/por-uf/*.json bb-coleta/por-uf/
          cp bb-coleta-temporaria/auditoria.json bb-coleta/auditoria.json

      - name: Enviar atualizacao ao GitHub
        if: steps.intervalo.outputs.run == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          date -u +"%Y-%m-%dT%H:%M:%S+00:00" > .bb-ultima-atualizacao.txt
          git add .bb-ultima-atualizacao.txt
          git add bb-catalogo-validacao.json bb-catalogo-atualizado.json bb-coleta/por-uf/
          git add -f bb-coleta/auditoria.json
          if ! git diff --cached --quiet; then
            git commit -m "Atualiza catalogo BB automaticamente"
            git push origin HEAD:main
          fi
