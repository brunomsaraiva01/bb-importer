
name: Atualizar catalogo BB

on:
  workflow_dispatch:
  schedule:
    - cron: "17 9 * * *"

permissions:
  contents: write

concurrency:
  group: bb-catalog-update
  cancel-in-progress: false

jobs:
  atualizar:
    runs-on: ubuntu-latest
    timeout-minutes: 180

    steps:
      - name: Baixar repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalar dependencias
        run: python -m pip install beautifulsoup4

      - name: Verificar intervalo de 15 dias
        id: intervalo
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY'
          import os
          import json
          import subprocess
          from datetime import datetime, timezone

          if os.environ["GITHUB_EVENT_NAME"] == "workflow_dispatch":
              print("run=true", file=open(os.environ["GITHUB_OUTPUT"], "a"))
              raise SystemExit(0)

          result = subprocess.run(
              ["gh", "api",
               f"repos/{os.environ['GITHUB_REPOSITORY']}/actions/workflows/bb-update.yml/runs",
               "-f", "status=completed",
               "-f", "per_page=100"],
              capture_output=True, text=True
          )

          if result.returncode != 0:
              raise SystemExit(result.stderr)

          data = json.loads(result.stdout)
          now = datetime.now(timezone.utc)
          recent = []

          for run in data.get("workflow_runs", []):
              if run["event"] not in ("schedule", "workflow_dispatch"):
                  continue
              if run["conclusion"] != "success":
                  continue
              finished = run.get("updated_at")
              if finished:
                  dt = datetime.fromisoformat(finished.replace("Z", "+00:00"))
                  recent.append(dt)

          run_now = not recent or (now - max(recent)).total_seconds() >= 15 * 86400
          with open(os.environ["GITHUB_OUTPUT"], "a") as output:
              print(f"run={str(run_now).lower()}", file=output)
          PY

      - name: Coletar imoveis BB
        if: steps.intervalo.outputs.run == 'true'
        run: |
          python bb_coletar_catalogo.py --limite 0 --pausa 2 --saida bb-coleta

      - name: Publicar JSONs
        if: steps.intervalo.outputs.run == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add bb-coleta/por-uf/
          if ! git diff --cached --quiet; then
            git commit -m "Atualizar catalogo BB"
            git push
          fi
